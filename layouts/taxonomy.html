{{ define "main" }}
<header class="page-head">
  <h1>{{ cond (eq .Data.Plural "tags") "태그" "카테고리" }}</h1>
</header>
<ul class="cat-cards">
  {{- range .Data.Terms.ByCount }}
  <li>
    <a href="{{ .Page.RelPermalink }}">
      <span class="cat-name">{{ .Page.LinkTitle }}</span>
      {{- with .Page.Description }}<span class="cat-desc">{{ . }}</span>{{ end }}
      <span class="cat-n">{{ .Count }}편 · 최근 {{ (index .Pages.ByDate.Reverse 0).Date.Format "2006.01.02" }}</span>
    </a>
  </li>
  {{- end }}
</ul>
{{ end }}
