{{- /* 한순간 카드: 큰 날짜 + (사진) + 한 줄. 받는 값: dict "p" 페이지 "big" 메인용 여부 */ -}}
{{- $p := .p }}
{{- $days := slice "일" "월" "화" "수" "목" "금" "토" }}
{{- $dw := $p.Date.Weekday | int }}
<figure class="moment{{ if .big }} moment-big{{ end }}">
  {{- with $p.Params.photo }}{{ with $p.Resources.Get . }}
    {{- $img := .Resize "1200x webp q80" }}
    <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="" loading="lazy">
  {{- end }}{{ end }}
  <figcaption>
    <span class="moment-date{{ if eq $dw 0 }} sun{{ else if eq $dw 6 }} sat{{ end }}">
      <span class="d">{{ $p.Date.Day }}</span>
      <span class="m">{{ $p.Date.Format "2006.01" }} {{ index $days $dw }}</span>
    </span>
    <span class="moment-line">{{ $p.Content | plainify | htmlUnescape | strings.TrimSpace }}</span>
  </figcaption>
</figure>
