{{- /* 한순간 카드: 요일 색 일력 한 장. 받는 값: dict "p" 페이지 */ -}}
{{- $p := .p }}
{{- $days := slice "일" "월" "화" "수" "목" "금" "토" }}
{{- $dw := $p.Date.Weekday | int }}
<figure class="mc wd-{{ $dw }}">
  {{- with $p.Params.photo }}{{ with $p.Resources.Get . }}
    {{- $img := .Fill "800x600 webp q80 Smart" }}
  <img src="{{ $img.RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="" loading="lazy">
  {{- end }}{{ end }}
  <span class="mc-num" aria-hidden="true">{{ $p.Date.Day }}</span>
  <figcaption>
    <time class="mc-date" datetime="{{ $p.Date.Format "2006-01-02" }}">{{ $p.Date.Format "2006.01.02" }} · {{ index $days $dw }}</time>
    <span class="mc-line">{{ $p.Content | plainify | htmlUnescape | strings.TrimSpace }}</span>
  </figcaption>
</figure>
