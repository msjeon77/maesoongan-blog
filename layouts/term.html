{{ define "main" }}
<header class="page-head">
  <p class="eyebrow">{{ cond (eq .Data.Plural "tags") "태그" "카테고리" }} · {{ len .Pages }}편</p>
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="lede">{{ . }}</p>{{ end }}
</header>
<ul class="rows">
  {{- range .Pages.ByDate.Reverse }}{{ partial "post-row.html" . }}{{ end }}
</ul>
{{ end }}
