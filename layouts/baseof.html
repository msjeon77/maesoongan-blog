<!doctype html>
<html lang="ko">
<head>
  {{ partial "head.html" . }}
</head>
{{- $kst := now.UTC.Add (time.ParseDuration "9h") }}
<body class="wd-{{ $kst.Weekday | int }}">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="wrap">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
